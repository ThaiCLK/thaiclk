name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"   # cập nhật mỗi ngày
  workflow_dispatch:       # cho phép bấm chạy tay

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year   # hoặc full-year
          config_timezone: Asia/Ho_Chi_Minh
